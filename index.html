.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;counter-reset:s}
.step{counter-increment:s;background:var(--char);border-radius:8px;padding:22px}

.contact{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,80px);align-items:start}

footer{background:var(--black);color:#9aa3a5;padding:32px 0 calc(32px + env(safe-area-inset-bottom));font-size:13px;border-top:1px solid #1d1d1d}

.fld{display:grid;gap:6px;margin-top:14px;font-size:13px;font-weight:600}

.switch{margin-top:16px;font-size:14px;text-align:center;color:var(--ash)}
.switch a{color:var(--violet);font-weight:500}

/* app */
.app{padding-top:32px;padding-bottom:96px}
.app-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.app-h h1{font-size:clamp(30px,4vw,46px);letter-spacing:-.02em;line-height:.96}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.courses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.course{display:flex;flex-direction:column;gap:12px;padding:0;overflow:hidden;cursor:pointer}
.course>*:not(.course-top){margin:0 18px}
.course>*:last-child{margin-bottom:18px}
.course-top{height:170px;position:relative;display:flex;align-items:flex-end;padding:14px;font-size:0;background:var(--char) center/cover}
.bar{height:6px;border-radius:100px;background:#ececec;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:100px;transition:width .5s}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.chart{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:12px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:11px;color:var(--ash)}
.chart i{width:100%;max-width:36px;border-radius:4px 4px 0 0;background:var(--cyan)}
.chart i.good{background:var(--green)}
.list{display:grid}
.list>*{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--fog);font-size:14px}
.list>*:last-child{border-bottom:0}
.score{font-weight:700;padding:3px 10px;border-radius:100px;font-size:12px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--fog);margin-bottom:24px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;border:0;background:none;cursor:pointer;font-weight:600;color:var(--ash);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--green)}
.chap{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
.chap-list{display:grid;gap:4px;position:sticky;top:76px}
.chap-list button{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:4px;border:0;background:none;cursor:pointer;font-size:14px;font-weight:500}

.chk{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:11px;flex:none;opacity:.7}
.chk.on{background:var(--green);border-color:var(--green);color:var(--ink);opacity:1}
.lesson h2{font-size:30px;letter-spacing:-.02em;line-height:1.05;margin-bottom:16px}

.lesson ul{margin:0 0 16px 20px;color:#2d3739}

.themes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.themes button{border:1px solid var(--graphite);background:#fff;border-radius:100px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:600}

.flash{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.fc{display:block;width:100%;padding:0;color:inherit;perspective:1000px;min-height:220px;cursor:pointer;border:0;background:none;text-align:left}
.fc-in{position:relative;width:100%;height:100%;min-height:220px;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px;padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.fc-f{background:#fff;border:1px solid var(--fog);box-shadow:var(--sh)}

.fc-b small{color:var(--neon)}

.known{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;background:var(--okbg);color:var(--ok);padding:3px 8px;border-radius:100px}
.quiz{max-width:760px}
.q-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--ash)}

.q-nav{display:flex;justify-content:flex-end;margin-top:20px}
.result{text-align:center;padding:40px 24px}
.ring{width:150px;height:150px;margin:0 auto 20px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:34px}
.recap{text-align:left;margin-top:28px;display:grid;gap:8px}
.recap div{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:4px;background:#f4f4f4;font-size:14px}
.app .stats{margin-bottom:24px}
.app .stat:nth-child(1){background:var(--black)}

.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--black);padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:#9aa3a5;padding:6px 10px;min-width:64px}
.tabbar a span{font-size:20px;line-height:1}
.tabbar a.on{color:var(--green)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:var(--black);color:#fff;border-left:3px solid var(--green);padding:12px 18px;border-radius:4px;font-size:14px;z-index:90;transition:transform .3s;max-width:calc(100% - 32px)}

.demo{background:var(--violet);color:rgba(255,255,255,.92);font-size:12.5px;text-align:center;padding:8px var(--g)}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const users=()=>store.get("rv-users",{});
const me=()=>{const e=store.get("rv-session",null);return e?{email:e,...users()[e]}:null};
const prog=()=>{const u=me();return u?store.get("rv-prog-"+u.email,{}):{}};
const saveProg=p=>{const u=me();if(u)store.set("rv-prog-"+u.email,p)};
const cp=(p,id)=>(p[id]=p[id]||{done:[],known:[],quiz:[]});
async function hash(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tt;const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2400)};
const pct=(c,p)=>{const x=cp(p,c.id);const tot=c.chapitres.length+1;return Math.round(((x.done.length)+(x.quiz.length?1:0))/tot*100)};
const best=(c,p)=>{const q=cp(p,c.id).quiz;return q.length?Math.max(...q.map(r=>Math.round(r.s/r.t*100))):null};
const cls=v=>v>=80?"g":v>=50?"m":"b";

function nav(route){
  const u=me(),inApp=!!u&&route!=="home";
  document.body.classList.toggle("in-app",!!u);
  $("#links").innerHTML=u
    ?[["#/tableau","Tableau de bord","tableau"],["#/formations","Formations","formations"],["#/resultats","Résultats","resultats"]].map(([h,l,r])=>`<a href="${h}" class="${route===r?"on":""}">${l}</a>`).join("")
    :`<a href="#/" >Accueil</a><a href="#/fonctionnalites">Fonctionnalités</a><a href="#/formations-public">Formations</a><a href="#/faq">FAQ</a><a href="#/contact">Contact</a>`;
  $("#navR").innerHTML=u
    ?`<button class="btn btn-t small hide-m" id="logout">Se déconnecter</button><button class="avatar" id="av" title="${esc(u.name)}">${esc(u.name[0].toUpperCase())}</button>`
    :`<a class="btn btn-t hide-m" href="#/connexion">Se connecter</a><a class="btn btn-p" href="#/inscription">Commencer</a>`;
  $("#tabbar").innerHTML=u?[["#/tableau","🏠","Accueil","tableau"],["#/formations","📚","Formations","formations"],["#/resultats","📈","Résultats","resultats"],["#/profil","👤","Profil","profil"]].map(([h,i,l,r])=>`<a href="${h}" class="${route===r?"on":""}"><span>${i}</span>${l}</a>`).join(""):"";
  const lo=$("#logout");if(lo)lo.onclick=logout;const av=$("#av");if(av)av.onclick=()=>location.hash="#/profil";
}

    f.innerHTML=`<h3 class="h3">Merci ${esc(f.n.value.trim())} !</h3><p class="muted" style="margin-top:8px">Votre demande est bien envoyée. Nous revenons vers vous sous 24 h ouvrées.</p>`};
  if(scrollTo){const el=document.getElementById(scrollTo);if(el)el.scrollIntoView()}else scrollTo0();
}
const scrollTo0=()=>window.scrollTo(0,0);
const IMG=(id,w)=>`https://images.unsplash.com/photo-${id}?w=${w}&q=80&auto=format&fit=crop`;

function auth(mode){
  const reg=mode==="inscription";
  $("#view").innerHTML=`<section class="auth"><form class="card" id="af" novalidate>
    <h1>${reg?"Créez votre compte":"Bon retour 👋"}</h1><p class="muted small">${reg?"Accédez à vos formations, fiches et QCM.":"Connectez-vous pour reprendre votre progression."}</p>
    ${reg?`<label class="fld">Prénom<input name="name" autocomplete="given-name" required></label>`:""}
    <label class="fld">E-mail<input name="email" type="email" autocomplete="email" required></label>
    <label class="fld">Mot de passe<input name="pw" type="password" autocomplete="${reg?"new-password":"current-password"}" minlength="6" required></label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn btn-p" style="width:100%;margin-top:4px" type="submit">${reg?"Commencer gratuitement":"Se connecter"}</button>
    <p class="switch"><a href="#/demo">Essayer sans compte avec la démo</a></p>
    <p class="switch" style="margin-top:8px">${reg?`Déjà inscrit ? <a href="#/connexion">Se connecter</a>`:`Pas encore de compte ? <a href="#/inscription">Créer un compte</a>`}</p>
  </form></section>`;
  bindAuth(reg);scrollTo0();
}
function bindAuth(reg){
  $("#af").onsubmit=async e=>{e.preventDefault();const f=e.target,em=f.email.value.trim().toLowerCase(),pw=f.pw.value,err=$("#err");
    if(reg&&!f.name.value.trim())return err.textContent="Indiquez votre prénom.";
    if(!/^\S+@\S+\.\S+$/.test(em))return err.textContent="Adresse e-mail invalide.";
    if(pw.length<6)return err.textContent="Le mot de passe doit contenir au moins 6 caractères.";
    const all=users(),h=await hash(em+":"+pw);
    if(reg){if(all[em])return err.textContent="Un compte existe déjà avec cet e-mail.";all[em]={name:f.name.value.trim(),h,since:Date.now()};store.set("rv-users",all)}
    else if(!all[em]||all[em].h!==h)return err.textContent="E-mail ou mot de passe incorrect.";
    store.set("rv-session",em);toast(reg?"Compte créé, bienvenue !":"Connexion réussie");location.hash="#/tableau"};
}

async function demo(){const all=users(),em="demo@revisio.fr";
  if(!all[em]){all[em]={name:"Camille",h:await hash(em+":demo123"),since:Date.now()};store.set("rv-users",all);
    const d=Date.now(),day=864e5;store.set("rv-prog-"+em,{projet:{done:[0,1,2],known:[0,1,3],quiz:[{s:3,t:6,d:d-6*day},{s:4,t:6,d:d-4*day},{s:5,t:6,d:d-2*day}]},excel:{done:[0],known:[1],quiz:[{s:3,t:5,d:d-day}]},client:{done:[],known:[],quiz:[]}})}
  store.set("rv-session",em);toast("Vous explorez le compte de démonstration");location.hash="#/tableau"}

function guard(){if(!me()){location.hash="#/connexion";return false}return true}

function dashboard(){
  const u=me(),p=prog();
  const allQ=COURSES.flatMap(c=>cp(p,c.id).quiz.map(r=>({...r,c})) ).sort((a,b)=>a.d-b.d);
  const avg=allQ.length?Math.round(allQ.reduce((s,r)=>s+r.s/r.t,0)/allQ.length*100):0;
  const glob=Math.round(COURSES.reduce((s,c)=>s+pct(c,p),0)/COURSES.length);
  const known=COURSES.reduce((s,c)=>s+cp(p,c.id).known.length,0);
  const next=COURSES.find(c=>pct(c,p)>0&&pct(c,p)<100)||COURSES.find(c=>pct(c,p)<100)||COURSES[0];
  const last=allQ.slice(-8);
  $("#view").innerHTML=`<section class="app wrap">
    <div class="app-h"><div><p class="cap">TABLEAU DE BORD</p><h1>Bonjour ${esc(u.name)} 👋</h1></div><a class="btn btn-p" href="#/formation/${next.id}">${pct(next,p)?"Reprendre":"Commencer"} : ${next.titre}</a></div>
    <div class="stats">
      <div class="stat"><span>Progression globale</span><b>${glob} %</b></div>
      <div class="stat"><span>QCM réalisés</span><b>${allQ.length}</b></div>
      <div class="stat"><span>Score moyen</span><b>${allQ.length?avg+" %":"—"}</b></div>
      <div class="stat"><span>Fiches maîtrisées</span><b>${known}</b></div>
    </div>
    <div class="grid2">
      <div class="card"><div class="row"><h2 class="h3">Mes formations</h2><a class="small" style="color:var(--violet);font-weight:500" href="#/formations">Tout voir</a></div>
        <div class="list" style="margin-top:8px">${COURSES.map(c=>`<a href="#/formation/${c.id}" style="display:grid;grid-template-columns:44px 1fr auto;gap:12px"><span style="width:44px;height:44px;border-radius:10px;background:#000 url(${IMG(c.img,400)}) center/cover;display:grid;place-items:center;font-size:20px"></span><span><b>${c.titre}</b><div class="bar" style="margin-top:8px"><i style="width:${pct(c,p)}%"></i></div></span><span class="cap">${pct(c,p)} %</span></a>`).join("")}</div></div>
      <div class="card"><h2 class="h3">Mes derniers scores</h2>
        ${last.length?`<div class="chart">${last.map(r=>{const v=Math.round(r.s/r.t*100);return `<div title="${r.c.titre} : ${v} %"><b style="font-size:11px;color:var(--ink)">${v}%</b><i class="${v>=80?"good":""}" style="height:${Math.max(v,6)}%"></i>${r.c.emoji}</div>`}).join("")}</div>`:`<p class="empty">Passez votre premier QCM pour voir vos scores ici.</p>`}
      </div>
    </div>
  </section>`;scrollTo0();
}

function catalogue(){const p=prog();
  $("#view").innerHTML=`<section class="app wrap"><div class="app-h"><div><p class="cap">CATALOGUE</p><h1>Formations</h1></div></div>
  <div class="courses">${COURSES.map(c=>{const b=best(c,p);return `<a class="card course" href="#/formation/${c.id}"><div class="course-top" style="background:#000 url(${IMG(c.img,400)}) center/cover"></div><div class="row"><span class="pill" style="background:#f1f1f1">${c.niveau}</span><span class="cap">${c.duree}</span></div><h3 class="h3">${c.titre}</h3><p class="muted small">${c.desc}</p><div class="bar"><i style="width:${pct(c,p)}%"></i></div><div class="row small"><span class="muted">${pct(c,p)} % terminé</span>${b!==null?`<span class="score ${cls(b)}">Meilleur : ${b} %</span>`:""}</div></a>`}).join("")}</div></section>`;scrollTo0();
}

let cur={c:null,tab:"cours",chap:0,theme:"Tous",qi:0,ans:[]};
function course(id,tab){
  const c=COURSES.find(x=>x.id===id);if(!c){location.hash="#/formations";return}
  if(cur.c!==c){cur={c,tab:"cours",chap:0,theme:"Tous",qi:0,ans:[]}}
  if(tab)cur.tab=tab;
  const p=prog();
  $("#view").innerHTML=`<section class="app wrap">
    <a href="#/formations" class="small muted">← Formations</a>
    <div class="app-h" style="margin-top:12px"><div style="display:flex;gap:16px;align-items:center"><span style="width:56px;height:56px;border-radius:12px;background:#000 url(${IMG(c.img,400)}) center/cover;display:grid;place-items:center;font-size:28px;flex:none"></span><div><h1>${c.titre}</h1><p class="muted small">${c.niveau} · ${c.duree} · ${pct(c,p)} % terminé</p></div></div></div>
    <div class="tabs" role="tablist">${[["cours","📖 Cours"],["fiches","🗂️ Fiches de révision"],["qcm","✅ QCM"]].map(([k,l])=>`<button class="tab" role="tab" aria-selected="${cur.tab===k}" data-tab="${k}">${l}</button>`).join("")}</div>
    <div id="pane"></div></section>`;
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{cur.tab=b.dataset.tab;if(cur.tab==="qcm"){cur.qi=0;cur.ans=[]}course(id)});
  ({cours:paneCours,fiches:paneFiches,qcm:paneQcm})[cur.tab](c);
}
function paneCours(c){const p=prog(),x=cp(p,c.id),ch=c.chapitres[cur.chap];
  $("#pane").innerHTML=`<div class="chap"><div class="chap-list">${c.chapitres.map((h,i)=>`<button data-ch="${i}" aria-current="${i===cur.chap}"><span class="chk ${x.done.includes(i)?"on":""}">${x.done.includes(i)?"✓":i+1}</span>${h.t}</button>`).join("")}</div>
  <article class="card lesson"><p class="cap">CHAPITRE ${cur.chap+1} / ${c.chapitres.length}</p><h2 style="margin-top:6px">${ch.t}</h2>${ch.c}
  <div class="row" style="margin-top:24px;flex-wrap:wrap"><button class="btn btn-t" id="prev" ${cur.chap===0?"disabled style='visibility:hidden'":""}>← Précédent</button>
  <button class="btn btn-p" id="done">${cur.chap<c.chapitres.length-1?"Terminé, chapitre suivant →":"Terminé, réviser les fiches →"}</button></div></article></div>`;
  document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{cur.chap=+b.dataset.ch;paneCours(c)});
  $("#prev").onclick=()=>{cur.chap--;paneCours(c)};
  $("#done").onclick=()=>{const p=prog(),x=cp(p,c.id);if(!x.done.includes(cur.chap))x.done.push(cur.chap);saveProg(p);
    if(cur.chap<c.chapitres.length-1){cur.chap++;course(c.id)}else{toast("Cours terminé ! Place à la révision.");course(c.id,"fiches")}window.scrollTo({top:0,behavior:"smooth"})};
}
function paneFiches(c){const p=prog(),x=cp(p,c.id),themes=["Tous",...new Set(c.fiches.map(f=>f.th))];
  const list=c.fiches.map((f,i)=>({...f,i})).filter(f=>cur.theme==="Tous"||f.th===cur.theme);
  $("#pane").innerHTML=`<div class="row" style="flex-wrap:wrap;margin-bottom:4px"><p class="muted small">Touchez une fiche pour la retourner. ${x.known.length}/${c.fiches.length} maîtrisées.</p><button class="btn btn-g" id="toQ">Je me teste au QCM →</button></div>
  <div class="themes" style="margin-top:14px">${themes.map(t=>`<button aria-pressed="${t===cur.theme}" data-th="${esc(t)}">${t}</button>`).join("")}</div>
  <div class="flash">${list.map(f=>`<div><button class="fc" data-fc aria-label="Fiche : ${esc(f.q)}"><div class="fc-in"><div class="fc-f">${x.known.includes(f.i)?`<span class="known">✓ Maîtrisée</span>`:""}<small>${f.th}</small><strong>${f.q}</strong><small>Toucher pour voir la réponse ↻</small></div><div class="fc-b"><small>Réponse</small><span>${f.r}</span><small>Toucher pour revenir ↻</small></div></div></button>
  <button class="btn ${x.known.includes(f.i)?"btn-g":"btn-t"} small" style="margin-top:8px;width:100%" data-k="${f.i}">${x.known.includes(f.i)?"✓ Je maîtrise":"Marquer comme maîtrisée"}</button></div>`).join("")}</div>`;
  document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{cur.theme=b.dataset.th;paneFiches(c)});
  document.querySelectorAll("[data-fc]").forEach(b=>b.onclick=()=>b.classList.toggle("flip"));
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const p=prog(),x=cp(p,c.id),k=+b.dataset.k;x.known=x.known.includes(k)?x.known.filter(v=>v!==k):[...x.known,k];saveProg(p);paneFiches(c)});
  $("#toQ").onclick=()=>{cur.qi=0;cur.ans=[];course(c.id,"qcm")};
}
function paneQcm(c){
  if(cur.qi>=c.qcm.length)return qcmResult(c);
  const q=c.qcm[cur.qi],a=cur.ans[cur.qi];
  $("#pane").innerHTML=`<div class="quiz card"><div class="q-top"><span>Question ${cur.qi+1} / ${c.qcm.length}</span><span>${cur.ans.filter((v,i)=>v===c.qcm[i].a).length} bonne(s) réponse(s)</span></div>
  <div class="bar"><i style="width:${cur.qi/c.qcm.length*100}%"></i></div>
  <p class="q-text">${q.q}</p>
  <div class="opts">${q.o.map((o,i)=>`<button class="opt ${a!==undefined?(i===q.a?"ok":i===a?"ko":""):""}" data-o="${i}" ${a!==undefined?"disabled":""}><b>${"ABCD"[i]}</b><span>${o}</span></button>`).join("")}</div>
  <div class="explain ${a!==undefined?"on":""}">${a===q.a?"✅ <b>Bonne réponse !</b> ":"❌ <b>Pas tout à fait.</b> La bonne réponse est <b>"+"ABCD"[q.a]+"</b>. "}${q.e}</div>
  <div class="q-nav">${a!==undefined?`<button class="btn btn-p" id="nq">${cur.qi<c.qcm.length-1?"Question suivante →":"Voir mon résultat"}</button>`:""}</div></div>`;
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{cur.ans[cur.qi]=+b.dataset.o;paneQcm(c)});
  const n=$("#nq");if(n){n.onclick=()=>{cur.qi++;if(cur.qi>=c.qcm.length){const p=prog(),x=cp(p,c.id);x.quiz.push({s:cur.ans.filter((v,i)=>v===c.qcm[i].a).length,t:c.qcm.length,d:Date.now()});saveProg(p)}paneQcm(c)};n.focus()}
}
function qcmResult(c){const s=cur.ans.filter((v,i)=>v===c.qcm[i].a).length,t=c.qcm.length,v=Math.round(s/t*100),R=64,L=2*Math.PI*R;
  const col=v>=80?"var(--ok)":v>=50?"var(--amber)":"var(--ko)";
  $("#pane").innerHTML=`<div class="quiz card result"><div class="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="${R}" stroke="rgba(0,0,0,.07)" stroke-width="12" fill="none"/><circle cx="75" cy="75" r="${R}" stroke="${col}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-v/100)}"/></svg><b>${v} %</b></div>
  <h2 class="h3">${v>=80?"Excellent travail ! 🎉":v>=50?"C'est en bonne voie 💪":"Encore un petit effort 📚"}</h2><p class="muted">${s} bonne(s) réponse(s) sur ${t}. Votre score est enregistré dans vos résultats.</p>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px"><button class="btn btn-p" id="again">Recommencer le QCM</button><button class="btn btn-o" id="rev">Revoir les fiches</button></div>
  <div class="recap">${c.qcm.map((q,i)=>`<div><span>${cur.ans[i]===q.a?"✅":"❌"}</span><span><b>${q.q}</b><br><span class="muted">Réponse : ${q.o[q.a]}</span></span></div>`).join("")}</div></div>`;
  $("#again").onclick=()=>{cur.qi=0;cur.ans=[];paneQcm(c)};$("#rev").onclick=()=>course(c.id,"fiches");
}
function results(){const p=prog();const all=COURSES.flatMap(c=>cp(p,c.id).quiz.map(r=>({...r,c}))).sort((a,b)=>b.d-a.d);
  $("#view").innerHTML=`<section class="app wrap"><div class="app-h"><div><p class="cap">SUIVI</p><h1>Mes résultats</h1></div></div>
  <div class="grid2"><div class="card"><h2 class="h3">Historique des QCM</h2><div class="list" style="margin-top:8px">${all.length?all.map(r=>{const v=Math.round(r.s/r.t*100);return `<div><span>${r.c.emoji} <b>${r.c.titre}</b><br><span class="cap">${new Date(r.d).toLocaleDateString("fr-FR",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})} · ${r.s}/${r.t}</span></span><span class="score ${cls(v)}">${v} %</span></div>`}).join(""):`<p class="empty">Aucun QCM pour l'instant. <a href="#/formations" style="color:var(--violet)">Choisir une formation</a></p>`}</div></div>
  <div class="card"><h2 class="h3">Par formation</h2><div class="list" style="margin-top:8px">${COURSES.map(c=>{const b=best(c,p),x=cp(p,c.id);return `<a href="#/formation/${c.id}"><span>${c.emoji} <b>${c.titre}</b><br><span class="cap">${x.done.length}/${c.chapitres.length} chapitres · ${x.known.length}/${c.fiches.length} fiches · ${x.quiz.length} QCM</span></span>${b!==null?`<span class="score ${cls(b)}">${b} %</span>`:`<span class="cap">—</span>`}</a>`}).join("")}</div></div></div></section>`;scrollTo0();
}
function profil(){const u=me();
  $("#view").innerHTML=`<section class="app wrap"><div class="app-h"><div><p class="cap">COMPTE</p><h1>Mon profil</h1></div></div>
  <div class="card" style="max-width:520px"><div style="display:flex;gap:16px;align-items:center"><span class="avatar" style="width:56px;height:56px;font-size:22px">${esc(u.name[0].toUpperCase())}</span><div><b style="font-size:20px">${esc(u.name)}</b><p class="muted small">${esc(u.email)}</p></div></div>
  <p class="muted small" style="margin-top:16px">Membre depuis le ${new Date(u.since).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="btn btn-o" id="reset">Réinitialiser ma progression</button><button class="btn btn-t" id="lo2">Se déconnecter</button></div></div></section>`;
  $("#lo2").onclick=logout;$("#reset").onclick=()=>{saveProg({});toast("Progression réinitialisée");};scrollTo0();
}

/* ================= ROUTEUR ================= */
function route(){const h=location.hash.replace(/^#\/?/,"").split("/");const r=h[0]||"home";
  const pub={home:()=>home(),fonctionnalites:()=>home("fonctionnalites"),"formations-public":()=>home("formations-public"),faq:()=>home("faq"),contact:()=>home("contact"),pourqui:()=>home("pourqui"),organisme:()=>home("organisme"),connexion:()=>auth("connexion"),inscription:()=>auth("inscription"),demo};
  const priv={tableau:dashboard,formations:catalogue,formation:()=>course(h[1],h[2]),resultats:results,profil};
  if(pub[r]){if(me()&&(r==="connexion"||r==="inscription")){location.hash="#/tableau";return}nav(r==="home"?"home":r);pub[r]()}
  else if(priv[r]){if(!guard())return;nav(r==="formation"?"formations":r);priv[r]()}
  else{location.hash="#/"}
}
window.addEventListener("hashchange",route);route();
</script>
